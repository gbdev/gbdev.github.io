name: CI

on:
  push:
    branches: [ dev ]
  # Sent by awesome-gbdev when its README changes, to rebuild the resources page
  repository_dispatch:
    types: [ awesome-gbdev-updated ]
  workflow_dispatch:

# Don't let two deploys push to master at the same time
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout virens
      uses: actions/checkout@v4
      with:
        path: gbdevio

    - name: Install NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: yarn
        cache-dependency-path: gbdevio/yarn.lock

    - name: Install npm requirements
      run: yarn install
      working-directory: gbdevio/

    - name: Run Vue build
      run: yarn build
      working-directory: gbdevio/

    - name: Store final build
      uses: actions/upload-artifact@v4
      with:
        name: Build output
        path: gbdevio/website/.vuepress/dist
        if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout virens/gh-pages
      uses: actions/checkout@v4
      with:
        path: gbdevio
        ref: master

    - name: Delete all current files
      run: |
        rm -vrf gbdevio/*

    - name: Unpack build
      uses: actions/download-artifact@v4
      with:
        name: Build output
        path: gbdevio/

    - name: Create CNAME file
      run: |
        echo "gbdev.io" > gbdevio/CNAME

    - name: Deploy to gbdev.io
      working-directory: gbdevio/
      run: |
        git config --local user.name "GitHub Action"
        git config --global user.email "community@gbdev.io"
        git remote -v
        git branch -v
        git add -A
        if git diff --cached --quiet; then
          echo "Build output unchanged, nothing to deploy."
          exit 0
        fi
        git commit -m 'Update build'
        git push -v
